name: pollen

services:
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pollen}
      POSTGRES_USER: ${POSTGRES_USER:-pollen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Only runs on a fresh volume. The pipeline reapplies the same file on
      # every run, so a schema change does not need a volume reset.
      #
      # The ",z" on every host bind mount below is an SELinux relabel request.
      # Without it, an enforcing system (Fedora, RHEL) denies the container
      # process read access to these paths. Lowercase z applies the shared
      # container_file_t label; uppercase Z would stamp a private MCS category
      # and lock the path to one container. The flag is a no-op where SELinux
      # is not enabled, so it is safe to leave in everywhere.
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pollen} -d ${POSTGRES_DB:-pollen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pollen}
      POSTGRES_USER: ${POSTGRES_USER:-pollen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAX_FORECAST_AGE_HOURS: ${MAX_FORECAST_AGE_HOURS:-36}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Published on loopback only, because Caddy runs in the host network
    # namespace (see below) and so cannot reach the compose bridge by name.
    # Not reachable from outside the machine.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    # Host networking, so Caddy sees real client IPs.
    #
    # Rootless podman forwards published ports through a `rootlessport` helper
    # that SNATs every inbound connection: with a bridge network every request
    # arrives from the helper's address on 10.89.0.0/24 and the real client is
    # lost before Caddy ever sees it. There is no header to recover it from --
    # the rewrite happens at L3, not in a proxy. Sharing the host's network
    # namespace is the only way to keep the source address intact while staying
    # rootless.
    #
    # The listening port now comes from SITE_ADDRESS, not a ports: mapping:
    # ":8080" locally, and the bare domains in production (which means 80/443,
    # and so needs net.ipv4.ip_unprivileged_port_start=80 when rootless).
    network_mode: host
    environment:
      # ":80" locally (plain HTTP). In production, the comma-separated list of
      # names to serve; Caddy obtains and renews a certificate for each.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Set both in production to redirect the bare apex to the www host.
      # Unset locally, where the matcher then defaults to a name that can never
      # match and the redirect stays inert.
      APEX_HOST: ${APEX_HOST:-apex.invalid}
      WWW_HOST: ${WWW_HOST:-www.invalid}
      API_UPSTREAM: 127.0.0.1:${API_PORT:-8000}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./web:/srv/web:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Run-to-completion, never started by `compose up`. Driven by a systemd timer
  # in production and by `task pipeline` by hand.
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    profiles: ["manual"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pollen}
      POSTGRES_USER: ${POSTGRES_USER:-pollen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CDSAPI_URL: ${CDSAPI_URL}
      CDSAPI_KEY: ${CDSAPI_KEY}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      BRONZE_RETENTION_DAYS: ${BRONZE_RETENTION_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - bronze:/data/bronze
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  bronze:
