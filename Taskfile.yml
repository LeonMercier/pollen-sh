version: "3"

# Task runner for the pollen forecast stack. `task --list` shows everything.
#
# COMPOSE can be overridden if you use docker instead of podman:
#   COMPOSE="docker compose" task up

vars:
  COMPOSE: '{{.COMPOSE | default "podman-compose"}}'

tasks:
  default:
    desc: Show available tasks
    cmds: [task --list]
    silent: true

  # ==========================================================================
  # Stack
  # ==========================================================================
  up:
    desc: Build and start postgres, api and caddy
    cmds:
      - "{{.COMPOSE}} up -d --build"
      - 'echo "Site: http://localhost:${HTTP_PORT:-8080}"'

  down:
    desc: Stop the stack (data volumes persist)
    cmds: ["{{.COMPOSE}} down"]

  logs:
    desc: Follow logs from all services
    cmds: ["{{.COMPOSE}} logs -f"]

  ps:
    desc: Show container status
    cmds: ["{{.COMPOSE}} ps"]

  psql:
    desc: Open a psql shell on the database
    cmds:
      - "{{.COMPOSE}} exec postgres psql -U ${POSTGRES_USER:-pollen} -d ${POSTGRES_DB:-pollen}"

  clean:
    desc: Stop everything and delete all volumes (destroys the database)
    prompt: This deletes the database and every cached GRIB. Continue?
    cmds: ["{{.COMPOSE}} down -v"]

  # ==========================================================================
  # Pipeline
  # ==========================================================================
  pipeline:
    desc: Run the daily ETL now (reuses today's cached GRIB if present)
    cmds: ["{{.COMPOSE}} --profile manual run --rm --no-deps pipeline {{.CLI_ARGS}}"]

  pipeline:reprocess:
    desc: Rebuild the database from the newest cached GRIB, without calling CDS
    cmds:
      - "{{.COMPOSE}} --profile manual run --rm --no-deps pipeline --skip-extract"

  geocode:
    desc: Reload the cities table from GeoNames (run after the first pipeline run)
    cmds:
      - "{{.COMPOSE}} --profile manual run --rm --no-deps --entrypoint python pipeline -m pipeline.geocode"

  # ==========================================================================
  # Checks
  # ==========================================================================
  health:
    desc: Query the health endpoint
    cmds:
      - 'curl -fsS "http://localhost:${HTTP_PORT:-8080}/health" && echo'

  smoke:
    desc: End-to-end check against the running stack
    cmds:
      - bash deploy/smoke_test.sh
